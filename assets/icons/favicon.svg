<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#280905"/>
      <stop offset="50%" stop-color="#4A0603"/>
      <stop offset="100%" stop-color="#740A03"/>
    </linearGradient>

    <!-- Accent Orange-Crimson Gradient for the Logo Dot -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A45"/>
      <stop offset="100%" stop-color="#E6501B"/>
    </linearGradient>

    <!-- White Typography Gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FCEAE6"/>
    </linearGradient>

    <!-- Subtle Glow Filter for Accent -->
    <filter id="accentGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Square Background -->
  <rect width="512" height="512" rx="140" fill="url(#bgGrad)"/>

  <!-- Subtle Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="132" fill="none" stroke="rgba(230, 80, 27, 0.25)" stroke-width="4"/>

  <!-- Top Inner Edge Shine -->
  <path d="M 140 8 L 372 8 A 132 132 0 0 1 504 140 L 504 165 A 132 132 0 0 0 372 33 L 140 33 A 132 132 0 0 0 8 165 L 8 140 A 132 132 0 0 1 140 8 Z" fill="rgba(255, 255, 255, 0.08)"/>

  <!-- Letter 'R' Vector Path (Centered and Geometric) -->
  <path fill-rule="evenodd" d="M 140 120 L 270 120 C 330 120 370 155 370 210 C 370 255 335 285 285 295 L 365 392 L 290 392 L 225 300 L 205 300 L 205 392 L 140 392 Z M 205 175 L 260 175 C 290 175 305 190 305 210 C 305 230 290 245 260 245 L 205 245 Z" fill="url(#whiteGrad)"/>

  <!-- Accent Orange Dot '.' -->
  <circle cx="405" cy="365" r="27" fill="url(#accentGrad)" filter="url(#accentGlow)"/>
</svg>
